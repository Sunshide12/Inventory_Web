<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Correo Verificado - Sistema de Autenticación</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../../CSS/auth.css" />
</head>

<body class="auth-page">
  <div class="auth-container">
    <div class="auth-wrapper">
      <!-- Verification Card -->
      <div class="auth-card">
        <!-- Header Section -->
        <div class="auth-card-header">
          <div class="auth-icon-wrapper" style="background: linear-gradient(135deg, #10b981, #059669);">
            <i class="bi bi-check-circle-fill"></i>
          </div>
          <h1 class="auth-title">¡Correo Verificado!</h1>
          <p class="auth-subtitle">Tu cuenta ha sido verificada exitosamente</p>
        </div>

        <!-- Success Message -->
        <div class="text-center mb-4">
          <div class="mb-3">
            <i class="bi bi-envelope-check" style="font-size: 4rem; color: #10b981;"></i>
          </div>
          <h3 class="mb-3" style="color: var(--text-primary); font-weight: 600;">
            Verificación Completada
          </h3>
          <p class="mb-4" style="color: var(--text-secondary); font-size: 1rem;">
            Tu correo electrónico ha sido verificado correctamente. 
            Ya puedes iniciar sesión en tu cuenta.
          </p>
        </div>

        <!-- Action Button -->
        <a href="login.html" class="btn btn-primary btn-auth w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Ir a Iniciar Sesión
        </a>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Supabase Client and Auth Handling -->
  <script type="module">
    import { supabase } from "../../JS/Config/supabaseClient.js";
    
    // Manejar el hash de autenticación cuando el usuario viene del email de verificación
    async function handleEmailVerification() {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = hashParams.get('access_token');
      const refreshToken = hashParams.get('refresh_token');
      const type = hashParams.get('type');
      
      // Si hay tokens en el hash, significa que viene de verificación de email
      if (accessToken && type === 'signup') {
        try {
          // Establecer la sesión con los tokens del hash
          const { data, error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          
          if (error) {
            console.error("Error al establecer sesión:", error);
            showError("Error al verificar tu cuenta. Por favor intenta nuevamente.");
            return;
          }
          
          // Limpiar el hash de la URL para que se vea limpia
          window.history.replaceState({}, document.title, window.location.pathname);
          
          // Mostrar mensaje de éxito
          showSuccess("¡Email verificado exitosamente! Tu cuenta está activa.");
        
        } catch (error) {
          console.error("Error al procesar verificación:", error);
          showError("Error al procesar la verificación. Por favor intenta nuevamente.");
        }
      } else {
        // Si no hay hash, verificar si ya está autenticado
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          // Ya está autenticado, mostrar mensaje y redirigir
          showSuccess("Tu cuenta ya está verificada.");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 2000);
        }
      }
    }
    
    // Funciones para mostrar mensajes
    function showSuccess(message) {
      const card = document.querySelector('.auth-card');
      if (card) {
        const successDiv = document.createElement('div');
        successDiv.className = 'alert alert-success mt-3';
        successDiv.innerHTML = `<i class="bi bi-check-circle-fill me-2"></i>${message}`;
        card.appendChild(successDiv);
      }
    }
    
    function showError(message) {
      const card = document.querySelector('.auth-card');
      if (card) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'alert alert-danger mt-3';
        errorDiv.innerHTML = `<i class="bi bi-exclamation-triangle-fill me-2"></i>${message}`;
        card.appendChild(errorDiv);
      }
    }
    
    // Ejecutar cuando la página carga
    document.addEventListener("DOMContentLoaded", handleEmailVerification);
  </script>
</body>

</html>
